<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sneha Singh | Portfolio</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FLOATING BACKGROUND -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="logo">Sneha Singh</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>

    <button id="themeToggle">🌙</button>
  </header>

  <!-- HERO -->
  <section class="hero" id="home">

    <div class="hero-left reveal">
      <p class="greeting">Hi, I'm</p>

      <h1>Sneha Singh</h1>

      <h2>
        <span id="typing"></span>
      </h2>

      <p class="desc">
        Passionate about building impactful digital experiences through software development,
        analytics, and creative problem-solving.
      </p>

      <div class="buttons">
        <button class="primary">Explore My Work</button>
        <button class="secondary">Let’s Connect</button>
      </div>

      <div class="socials">
        <i class="fab fa-github"></i>
        <i class="fab fa-linkedin"></i>
        <i class="fas fa-envelope"></i>
        <i class="fas fa-code"></i>
      </div>
    </div>

    <div class="hero-right reveal">
      <div class="profile-card float">
        <img src="assets/sneha.jpg" alt="Sneha">
      </div>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
