<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f0df">
    <meta name="description" content="View and download Sneha Singh's resume.">
    <meta name="color-scheme" content="light dark">
    <title>Resume | Sneha Singh</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .resume-page {
            width: min(1100px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 28px 5% 50px;
        }

        .resume-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 65px;
        }

        .resume-back {
            min-height: 42px;
            padding: 10px 16px;
            font-size: 0.88rem;
        }

        .resume-content {
            padding: 0;
        }

        .resume-intro {
            margin-bottom: 42px;
            text-align: center;
        }

        .resume-intro .badge {
            margin-bottom: 22px;
        }

        .resume-intro h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.075em;
        }

        .resume-intro p {
            max-width: 520px;
            margin: 22px auto 0;
            color: var(--text-light);
            line-height: 1.8;
        }

        .resume-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            padding: 22px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .resume-file {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .resume-file-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            background: var(--accent);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.5rem;
        }

        .resume-file h2 {
            font-size: 1.05rem;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .resume-file p {
            margin-top: 4px;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .resume-download {
            flex-shrink: 0;
        }

        .resume-viewer {
            overflow: hidden;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .resume-viewer iframe {
            display: block;
            width: 100%;
            height: min(78vh, 900px);
            min-height: 500px;
            border: 0;
            background: #fff;
        }

        .resume-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 18px;
            color: var(--text-light);
            border-top: 2px solid var(--border-soft);
            text-align: center;
            font-size: 0.9rem;
        }

        .resume-fallback a {
            color: var(--primary);
            font-weight: 800;
            text-underline-offset: 4px;
        }

        .resume-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 35px;
            color: var(--text-light);
            font-size: 0.88rem;
        }

        .resume-footer a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
        }

        .resume-footer a:hover {
            color: var(--secondary);
        }

        @media (max-width: 600px) {
            .resume-page {
                padding: 20px 6% 32px;
            }

            .resume-header {
                margin-bottom: 48px;
            }

            .resume-intro {
                margin-bottom: 32px;
            }

            .resume-toolbar {
                align-items: stretch;
                padding: 17px;
            }

            .resume-download {
                width: 100%;
            }

            .resume-viewer iframe {
                height: 65vh;
                min-height: 420px;
            }

            .resume-footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .resume-page *,
            .resume-page *::before,
            .resume-page *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <main class="resume-page">
        <header class="resume-header">
            <a href="index.html" class="logo" aria-label="Sneha's portfolio home">sneha<span>.</span>dev</a>
            <a href="index.html" class="secondary resume-back">← Back to portfolio</a>
        </header>

        <section class="resume-content" aria-labelledby="resume-title">
            <div class="resume-intro">
                <span class="badge">A little about my journey</span>
                <h1 id="resume-title">My <span class="highlight">resume.</span></h1>
                <p>Here's the professional side of my little corner of the internet.</p>
            </div>

            <div class="resume-toolbar">
                <div class="resume-file">
                    <span class="resume-file-icon" aria-hidden="true">📄</span>
                    <div>
                        <h2>Sneha Singh</h2>
                        <p>Resume · PDF document</p>
                    </div>
                </div>

                <a href="SnehaSinghCV.pdf" class="primary resume-download" download="SnehaSinghCV.pdf">
                    ↓ Download resume
                </a>
            </div>

            <div class="resume-viewer">
                <iframe
                    src="SnehaSinghCV.pdf#view=FitH"
                    title="Sneha Singh resume PDF"
                    width="100%"
                    height="750"
                    loading="lazy"
                ></iframe>

                <div class="resume-fallback">
                    Can't see the PDF?
                    <a href="SnehaSinghCV.pdf" target="_blank" rel="noopener noreferrer">Open it in a new tab ↗</a>
                </div>
            </div>
        </section>

        <footer class="resume-footer">
            <span>Made with curiosity & a little chaos ✳</span>
            <a href="index.html">Back to the good stuff ↑</a>
        </footer>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
